name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RC_PROFILER_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-dev' }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      stable: ${{ steps.kind.outputs.stable }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check the release version
        id: kind
        run: |
          if [[ ! "$RC_PROFILER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'release tags must have the form vMAJOR.MINOR.PATCH, optionally with a prerelease suffix' >&2
            exit 1
          fi
          # Only a stable release gets system packages and is announced to Homebrew, apt and yum.
          if [[ "$RC_PROFILER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and test the jar at the release version
        run: |
          version="${RC_PROFILER_VERSION#v}"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$version" -DgenerateBackupPoms=false
          mvn -B -ntp verify
      - name: Check the built jar
        run: |
          version="${RC_PROFILER_VERSION#v}"
          jar="target/runtimeconditions-java-profiler-$version.jar"
          test -s "$jar"
          test "$(java -jar "$jar" --version)" = "$version"
          java -jar "$jar" --help
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.kind.outputs.stable == 'true'
        with:
          go-version: '1.26.5'
          cache: false
      - name: Install nfpm
        if: steps.kind.outputs.stable == 'true'
        env:
          GOBIN: ${{ runner.temp }}/release-tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Test the packaging helpers
        run: python3 -m unittest scripts/test_release_package.py
      - name: Build the release files
        run: |
          version="${RC_PROFILER_VERSION#v}"
          flags=()
          if [[ "${{ steps.kind.outputs.stable }}" == true ]]; then flags+=(--system-packages); fi
          python3 scripts/release-package.py --version "$RC_PROFILER_VERSION" \
            --jar "target/runtimeconditions-java-profiler-$version.jar" \
            --output "$RUNNER_TEMP/release-assets" "${flags[@]}"
      - name: Check that the archive runs
        run: |
          version="${RC_PROFILER_VERSION#v}"
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xzf "$RUNNER_TEMP/release-assets/rc-profiler-java_$version.tar.gz"
          test "$("$RUNNER_TEMP/unpacked/rc-profiler-java_$version/rc-profiler-java" --version)" = "$version"
      - name: Install the system packages in clean Ubuntu, Debian and Rocky Linux containers
        if: steps.kind.outputs.stable == 'true'
        run: scripts/check-packages.sh "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Verify the assets against their checksums
        working-directory: release-assets
        run: |
          version="${RC_PROFILER_VERSION#v}"
          test -s "runtimeconditions-java-profiler-$version.jar"
          test -s "rc-profiler-java_$version.tar.gz"
          sha256sum --check SHA256SUMS
      - name: Publish the tagged release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          latest=true
          if [[ "$RC_PROFILER_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease=true
            latest=false
          fi
          if draft=$(gh release view "$RC_PROFILER_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo 'refusing to replace an already published release' >&2
              exit 1
            fi
            gh release upload "$RC_PROFILER_VERSION" * --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RC_PROFILER_VERSION" * \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$RC_PROFILER_VERSION"
          fi
          gh release edit "$RC_PROFILER_VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$prerelease" --latest="$latest"

  notify-homebrew:
    needs: [build, publish]
    if: needs.build.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    environment: package-distribution
    permissions:
      contents: none
    steps:
      - name: Check that the dispatch token is configured
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::HOMEBREW_REPO_DISPATCH_TOKEN is not set, so the Homebrew formula is not updated"; fi
      - name: Trigger the Homebrew formula update
        if: steps.token.outputs.present == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEBREW_REPO_DISPATCH_TOKEN }}
          repository: runtimeconditions/homebrew-tools
          event-type: rc-profiler-java-release-published
          client-payload: '{"tag":"${{ github.ref_name }}"}'

  notify-linux-packages:
    needs: [build, publish]
    if: needs.build.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    environment: package-distribution
    permissions:
      contents: none
    steps:
      - name: Check that the dispatch token is configured
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::HOMEBREW_REPO_DISPATCH_TOKEN is not set, so the apt and yum repositories are not updated"; fi
      - name: Trigger the apt and yum repository publication
        if: steps.token.outputs.present == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEBREW_REPO_DISPATCH_TOKEN }}
          repository: runtimeconditions/packages
          event-type: rc-profiler-java-release-published
          client-payload: '{"tag":"${{ github.ref_name }}"}'
